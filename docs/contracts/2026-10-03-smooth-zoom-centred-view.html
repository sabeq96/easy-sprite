<header class="space-y-3">
  <h1 class="text-3xl font-semibold">Smooth zoom, centred editor, scroll on overflow (#16)</h1>
  <div class="meta"><span class="status-done">done</span><span>2026-10-03</span><span>approved 2026-10-03 @ 867e889</span><code>docs/contracts/2026-10-03-smooth-zoom-centred-view.html</code><span>supersedes <a href="2026-10-02-slower-zoom-wheel-pan.html">2026-10-02-slower-zoom-wheel-pan</a></span></div>
  <dl class="brief">
    <dt>Problem</dt><dd>Every wheel event jumps a whole ladder rung, so a pinch sweeps the whole range <a class="id" href="#F1">F1</a> <a class="id" href="#F2">F2</a>; the editor has no wheel scrolling <a class="id" href="#F1">F1</a>, and its sprite can be dragged off-centre even when it fits <a class="id" href="#F4">F4</a>. The stepped fix (superseded contract) felt dead between steps.</dd>
    <dt>Goal</dt><dd>Wheel and pinch zoom continuously at Piskel's pinch rate in both editors; the editor sprite is centred on any axis where it fits and scrolls/pans only where it overflows; only commands land on ladder rungs.</dd>
  </dl>
</header>

  </div>
  <p class="short">Pinch and ⌘/ctrl+wheel now zoom smoothly, a little on every event, in proportion to the current zoom — the same rate Piskel uses for pinch — and keep the point under the cursor in place in both editors. The +/− buttons, keys and "fit" still jump to the next ladder rung. In the pixel editor the sprite sits centred whenever it fits; once it is bigger than the view, a plain wheel, two-finger scroll, space-drag or middle-drag moves it, up to 24&nbsp;px past its edges and no further. The builder keeps its native scrolling and top-left layout.</p>

export const VIEW_PADDING = 24;            // fit padding and overflow scroll margin, px      D16 D17
export const WHEEL_ZOOM_BASE = 16 / 15;    // zoom multiplier per WHEEL_ZOOM_DELTA (Piskel)    D13 F13 F14
export const WHEEL_ZOOM_DELTA = 120;       // px of deltaY                                    D13 F13

// src/lib/math.ts — signature unchanged, semantics changed
export function stepLadder(value, ladder, direction): number;
//   → first rung strictly above (1) / below (−1) value; clamps at the ends                   D9 F7

// src/lib/format.ts — signature unchanged, output changed
export function formatZoom(scale: number): string;   // 7.34→"7.3×" 8→"8×" 13.4→"13×" 0.5→"0.5×"   D15

// src/core/viewport.ts
export function wheelZoomFactor(deltaY: number): number;                // WHEEL_ZOOM_BASE ** (−deltaY / WHEEL_ZOOM_DELTA)   D13 D6
export function constrainViewport(viewport: Viewport, container: Size, sprite: Size, padding?: number): Viewport;   // D10 D11 D17
export function fitViewport(container: Size, sprite: Size, padding = VIEW_PADDING): Viewport;   // unchanged behaviour  D16
- export function clampViewport(viewport, container, sprite): Viewport;    // removed, replaced by constrainViewport  D11

// src/editor/view/store.ts — ViewState
zoomByFactor: (cursor: Point, factor: number, sprite: Size) => void;    // new: clamp to ladder ends, zoomAt, constrain   D9 D14
setContainerSize: (size: Size, sprite: Size) => void;                   // changed: re-constrains the viewport   D10
panBy / zoom / fitToContainer                                           // now constrainViewport instead of clampViewport   D11

// src/stores/useBuilderViewStore.ts — BuilderViewState
zoomByFactor: (factor: number) => void;                                 // new: zoom × factor, clamped to BUILDER_ZOOM_LEVELS ends   D12 D14

// hooks — signatures unchanged
useCanvasViewControls(containerRef): void;   CANVAS_VIEW_HINTS + Zoom ⌘/Ctrl+Wheel, + Pan Wheel   D4
useBuilderViewport(panelRef): void;          now also subscribes to zoom (layout effect)          D18 D19</pre>

<pre class="view">size = sprite.width × scale                               (same for height)

  rect   = sheet element rect;  point = (client − rect.topLeft) / zoom
  next   = clamp(zoom × wheelZoomFactor(deltaY), 1, 12)

  rect = sheet element rect
