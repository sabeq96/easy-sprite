name: Release Please

# Keeps one "chore(main): release x.y.z" PR open that bumps package.json and CHANGELOG.md from the
# conventional commits on main. Merging it tags the release and publishes the GitHub Release.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # A PR opened with the default GITHUB_TOKEN does not trigger other workflows, so CI would
      # never run on the release PR. RELEASE_PLEASE_TOKEN (a fine-grained PAT or GitHub App token
      # with contents + pull-requests write) avoids that; without it this still works, minus CI.
      - uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
